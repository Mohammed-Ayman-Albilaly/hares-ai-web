# Web container: serves the SPA and proxies /api to the API container.

# Client address. The API trusts exactly ONE proxy (this nginx, TRUST_PROXY=1) and reads the
# address nginx writes into X-Forwarded-For. nginx writes $remote_addr and never forwards a header
# the client sent, so a client cannot choose the address the login throttle sees.
# Behind a load balancer on the same network, tell nginx which addresses may speak for clients,
# and $remote_addr becomes the real client address:
#   set_real_ip_from 10.0.0.0/8;       # the load balancer's address range
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Security headers on every answer. Styles need 'unsafe-inline' (React style
  # attributes and the chart library's SVG); scripts do not.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    # Resolved again every few seconds, so a recreated API container is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
    # CSV exports stream: do not buffer them in the proxy.
    proxy_buffering off;
    # The API sets its own security headers (helmet) and Cache-Control: no-store; do not repeat them here.
  }

  # Hashed build files never change: cache for a year.
  location /assets/ {
    # add_header in a location replaces the server-level ones, so the essentials are repeated.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Single-page app: unknown paths load index.html, and index.html itself is never cached.
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri /index.html;
  }
}
